<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#18324a">
<title>Operating Systems Learning Studio</title>
<style>
:root{--bg:#eaf0f6;--card:#fff;--ink:#243447;--navy:#18324a;--blue:#2e6ea6;--teal:#258b8d;--gold:#d5a33f;--line:#cbd8e5;--good:#227a4b;--bad:#b23b3b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf4fa,#dde8f2);color:var(--ink);font-family:Georgia,serif}header{background:linear-gradient(120deg,var(--navy),#285779);color:#fff;padding:13px 18px;border-bottom:5px solid var(--gold);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{margin:0;font-size:clamp(24px,4vw,38px)}.btn,.nav{border:1px solid var(--gold);border-radius:10px;padding:10px 13px;font:bold 14px system-ui;cursor:pointer;background:#fff;color:var(--navy);text-decoration:none}.primary,.nav.active{background:var(--blue);color:#fff;border-color:#8dc0e6}.layout{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 78px)}aside{background:#f9fcff;padding:10px;border-right:1px solid var(--line);overflow:auto}.nav{display:block;width:100%;text-align:left;margin:6px 0}main{max-width:1050px;width:100%;padding:18px;margin:auto}.card,.box,.question{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:13px;box-shadow:0 10px 25px #31516f15}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.option{display:block;border:1px solid var(--line);padding:11px;border-radius:9px;margin:8px 0;background:#fbfdff}.option:hover{border-color:var(--blue);background:#f0f7fd}select,input{width:100%;padding:10px;margin:6px 0;border:1px solid #9fb5c9;border-radius:8px;font-size:16px;background:#fff}.big{font-size:32px;color:var(--blue);font-weight:bold}.good{color:var(--good)}.bad{color:var(--bad)}.muted{color:#65788b}.timer{font-size:24px;font-weight:bold;color:var(--blue)}.menu{display:none}@media(max-width:760px){header{align-items:flex-start}.layout{display:block}aside{display:none;grid-template-columns:1fr 1fr;border-right:0}.open{display:grid;gap:5px}.menu{display:inline-block}.nav{margin:0;text-align:center;font-size:12px}main{padding:10px}}
</style>
</head>
<body>
<header><div><h1>Operating Systems Learning Studio</h1><small>Processes · Threads · Memory Management · Uniprocessor Scheduling · OS Structure</small></div><div class="row"><button id="menu" class="btn menu">☰ Topics</button><a class="btn" href="index.html">Back to Ebook</a></div></header>
<div class="layout"><aside id="nav"></aside><main id="app"><section class="card"><h2>Preparing learning activities…</h2></section></main></div>
<script>
'use strict';let bank=[],session=null,timer=null,reports=[];const app=document.getElementById('app'),nav=document.getElementById('nav');
const allowed=['Processes','Threads','Memory Management','Uniprocessor Scheduling','Operating System Structure'];
const pages=[['Dashboard',home],['Topic Review',topicReview],['Practice',()=>setup('practice')],['Timed Exam',()=>setup('exam')],['Question Review',review],['Instructor Dashboard',instructor],['Reports',showReports]];
pages.forEach(([name,fn],i)=>{const b=document.createElement('button');b.className='nav'+(i?'':' active');b.textContent=name;b.onclick=()=>{clearInterval(timer);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');nav.classList.remove('open');fn()};nav.appendChild(b)});menu.onclick=()=>nav.classList.toggle('open');
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function sample(n,t,d){return shuffle(bank.filter(q=>(!t||q.topic===t)&&(!d||q.difficulty===d))).slice(0,n)}
function home(){app.innerHTML='<section class="card"><h2>Learning Dashboard</h2><p>Review the five selected Operating Systems areas and assess understanding through practice and timed examinations.</p><div class="grid">'+allowed.map(t=>'<div class="box"><h3>'+t+'</h3><p class="muted">Focused concepts, applied questions, explanations, and assessment.</p><button class="btn" onclick="openTopic(\''+t.replaceAll("'","\\'")+'\')">Review topic</button></div>').join('')+'</div></section>'}
function openTopic(t){topicReview(t)}function topicReview(chosen=''){app.innerHTML='<section class="card"><h2>Topic Review</h2><label>Select topic<select id="reviewTopic">'+allowed.map(t=>'<option '+(t===chosen?'selected':'')+'>'+t+'</option>').join('')+'</select></label><button id="showTopic" class="btn primary">Show concepts</button><div id="topicOut"></div></section>';showTopic.onclick=()=>{const t=reviewTopic.value,items=bank.filter(q=>q.topic===t).slice(0,15);topicOut.innerHTML='<div class="box"><h3>'+t+'</h3><ul>'+[...new Set(items.map(q=>q.explanation))].map(x=>'<li>'+x+'</li>').join('')+'</ul><button class="btn primary" onclick="setup(\'practice\',\''+t.replaceAll("'","\\'")+'\')">Practice this topic</button></div>'};if(chosen)showTopic.click()}
function setup(kind,preset=''){app.innerHTML='<section class="card"><h2>'+(kind==='exam'?'Timed Exam':'Practice')+'</h2><label>Topic<select id="topic"><option value="">All five topics</option>'+allowed.map(t=>'<option '+(t===preset?'selected':'')+'>'+t+'</option>').join('')+'</select></label><label>Difficulty<select id="difficulty"><option value="">Mixed difficulty</option><option>Foundation</option><option>Applied</option><option>Challenge</option></select></label><label>Session length<select id="count"><option value="10">Quick</option><option value="20" selected>Standard</option><option value="30">Extended</option></select></label>'+(kind==='exam'?'<label>Duration<select id="minutes"><option>20</option><option selected>40</option><option>60</option></select></label>':'')+'<button id="start" class="btn primary">Start</button><div id="area"></div></section>';start.onclick=()=>{const items=sample(+count.value,topic.value,difficulty.value);if(!items.length)return alert('No questions match the selected filters.');session={kind,items,i:0,answers:[],checked:[],seconds:kind==='exam'?+minutes.value*60:0};renderQuestion();if(kind==='exam')timer=setInterval(()=>{session.seconds--;const c=document.getElementById('clock');if(c)c.textContent=formatTime(session.seconds);if(session.seconds<=0)finish()},1000)}}
function formatTime(s){return Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0')}function renderQuestion(){const s=session,q=s.items[s.i],area=document.getElementById('area');const opts=q.options.map((o,j)=>'<label class="option"><input type="radio" name="answer" value="'+j+'" '+(s.answers[s.i]===j?'checked':'')+'> '+o+'</label>').join('');const feedback=s.kind==='practice'&&s.checked[s.i]!==undefined?'<p class="'+(s.checked[s.i]?'good':'bad')+'">'+(s.checked[s.i]?'Correct. ':'Incorrect. ')+q.explanation+'</p>':'';area.innerHTML='<div class="question">'+(s.kind==='exam'?'<span id="clock" class="timer">'+formatTime(s.seconds)+'</span> · ':'')+'Question '+(s.i+1)+' of '+s.items.length+' · '+q.topic+' · '+q.difficulty+'<h2>'+q.question+'</h2>'+opts+feedback+'<div class="row"><button id="previous" class="btn">Previous</button>'+(s.kind==='practice'?'<button id="check" class="btn primary">Check</button>':'')+'<button id="next" class="btn">Next</button><button id="finish" class="btn">Finish</button></div></div>';area.querySelectorAll('input').forEach(r=>r.onchange=()=>s.answers[s.i]=+r.value);previous.onclick=()=>{s.i=Math.max(0,s.i-1);renderQuestion()};next.onclick=()=>{s.i=Math.min(s.items.length-1,s.i+1);renderQuestion()};if(s.kind==='practice')check.onclick=()=>{if(s.answers[s.i]===undefined)return alert('Select an answer.');s.checked[s.i]=s.answers[s.i]===q.answer;renderQuestion()};finish.onclick=finishSession}
function finishSession(){finish()}function finish(){clearInterval(timer);const s=session;const score=s.items.reduce((n,q,i)=>n+(s.answers[i]===q.answer),0),pct=Math.round(score/s.items.length*100);reports.unshift({date:new Date(),type:s.kind,total:s.items.length,score,pct,items:s.items,answers:s.answers});document.getElementById('area').innerHTML='<div class="box"><div class="big">'+score+' / '+s.items.length+'</div><p>Score: '+pct+'%</p><button class="btn" onclick="review()">Review result</button></div>'}
function review(){const r=reports[0];if(!r){app.innerHTML='<section class="card"><h2>Question Review</h2><p>Complete a practice session or exam first.</p></section>';return}app.innerHTML='<section class="card"><h2>Question Review</h2>'+r.items.map((q,i)=>'<div class="box"><h3>'+q.question+'</h3><p class="'+(r.answers[i]===q.answer?'good':'bad')+'">Your answer: '+(r.answers[i]===undefined?'Not answered':q.options[r.answers[i]])+'</p><p><b>Correct answer:</b> '+q.options[q.answer]+'</p><p>'+q.explanation+'</p></div>').join('')+'</section>'}
function instructor(){app.innerHTML='<section class="card"><h2>Instructor Dashboard</h2><label>Topic<select id="it"><option value="">All five topics</option>'+allowed.map(t=>'<option>'+t+'</option>').join('')+'</select></label><label>Difficulty<select id="idiff"><option value="">Mixed</option><option>Foundation</option><option>Applied</option><option>Challenge</option></select></label><label>Assessment length<select id="ic"><option>10</option><option selected>20</option><option>30</option></select></label><button id="generate" class="btn primary">Generate Assessment</button><button id="answerKey" class="btn">Generate Answer Key</button><div id="instructorOut"></div></section>';function make(key){const items=sample(+ic.value,it.value,idiff.value);instructorOut.innerHTML='<div class="box"><ol>'+items.map(q=>'<li><b>'+q.question+'</b><ol type="A">'+q.options.map((o,i)=>'<li>'+o+(key&&i===q.answer?' ✓':'')+'</li>').join('')+'</ol></li>').join('')+'</ol><button class="btn" onclick="print()">Print</button></div>'}generate.onclick=()=>make(false);answerKey.onclick=()=>make(true)}
function showReports(){app.innerHTML='<section class="card"><h2>Reports</h2>'+(reports.length?reports.map(r=>'<div class="box">'+r.date.toLocaleString()+' · '+r.type+' · '+r.score+'/'+r.total+' · '+r.pct+'%</div>').join(''):'<p>No completed assessments yet.</p>')+'</section>'}
fetch('./operating_system_question_bank.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{bank=data.filter(q=>allowed.includes(q.topic));home()}).catch(e=>{app.innerHTML='<section class="card"><h2 class="bad">Questions could not be loaded</h2><p>Upload <b>operating_system_question_bank.json</b> in the same folder as <b>studio.html</b>, then refresh.</p><p>'+e.message+'</p></section>'});
</script>
</body></html>
