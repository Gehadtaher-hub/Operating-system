<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operating Systems Studio</title><style>
:root{--bg:#07111b;--card:#0d1d2b;--ink:#e7f6f4;--muted:#9fc4c7;--blue:#39d9e6;--accent:#52e09b;--line:#285064;--good:#52e09b;--bad:#ff6b7a;--warn:#ffc857}body.light{--bg:#eef6f8;--card:#fff;--ink:#102532;--muted:#5c727d;--blue:#087b91;--accent:#16875f;--line:#bad3da;--good:#087a49;--bad:#b42318}body.high{--bg:#000;--card:#000;--ink:#fff;--muted:#fff;--blue:#ff0;--accent:#0f0;--line:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Arial;font-size:var(--fs,16px)}header{position:sticky;top:0;z-index:9;background:linear-gradient(110deg,#081522,#123149);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--blue)}header h1{font-size:clamp(18px,4vw,27px);margin:0}.layout{display:grid;grid-template-columns:275px 1fr;min-height:100vh}aside{background:var(--card);border-right:1px solid var(--line);padding:14px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}main{max-width:1080px;width:100%;padding:22px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);margin-bottom:18px}.nav,.btn{border:1px solid transparent;border-radius:10px;padding:11px 13px;font-weight:750;cursor:pointer}.nav{display:block;width:100%;margin:6px 0;text-align:left;background:color-mix(in srgb,var(--blue) 10%,var(--card));color:var(--ink)}.nav.active,.primary{background:linear-gradient(135deg,var(--accent),var(--blue));color:#041016}.secondary{background:var(--card);color:var(--blue);border:1px solid var(--blue)}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.metric,.question,.sim{border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}.metric strong,.big{font-size:34px;color:var(--blue)}.option{display:block;border:1px solid var(--line);border-radius:11px;padding:11px;margin:8px 0}.option:hover{background:color-mix(in srgb,var(--blue) 8%,var(--card))}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink;margin:5px 0)}textarea{min-height:110px}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:color-mix(in srgb,var(--blue) 16%,var(--card));color:var(--blue);font-weight:750}.good{color:var(--good)}.bad{color:var(--bad)}.progress{height:11px;background:var(--line);border-radius:9px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--blue))}.navigator{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.navigator button{width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}.navigator .ans{background:color-mix(in srgb,var(--good) 25%,var(--card))}.navigator .flag{outline:3px solid var(--warn)}.navigator .cur{border:3px solid var(--blue)}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.timer{font-size:24px;font-weight:850}.tiny{color:var(--muted);font-size:.9em}a{text-decoration:none}@media(max-width:760px){.layout{display:block}aside{position:static;height:auto;display:flex;overflow-x:auto;padding:7px}.nav{min-width:145px;text-align:center}aside h3{display:none}main{padding:11px}}@media print{header,aside,.no-print{display:none!important}.layout{display:block}main{padding:0}}</style></head><body>
<header><h1>Operating Systems Ebook Activities</h1><div class="row"><a class="btn secondary" href="index.html">Back to Books</a><span id="who">Guest</span><button class="btn secondary" onclick="accessibility()">Accessibility</button></div></header><div class="layout"><aside><h3>Studio</h3><div id="nav"></div></aside><main><div id="app"></div></main></div>
<script>
'use strict';const topics={Processes:[['A program in execution is called a','Process','File|Page|Compiler'],['The PCB stores','Process context and management data','Only source code|Disk sectors|Passwords'],['A process in the ready state is','waiting for CPU time','executing on CPU|waiting for I/O|terminated'],['A context switch saves and restores','process execution state','file names|disk sectors|network routes'],['A zombie process has','terminated but still has a process-table entry','never started|lost its parent before termination|entered kernel mode']],Scheduling:[['FCFS schedules by','Arrival order','Shortest burst|Highest priority|Page number'],['Round Robin is controlled by the','Time quantum','Page size|Disk track|Semaphore count'],['SJF may starve','Long jobs','First arrivals|I/O devices|Page tables'],['Preemptive SJF is called','SRTF','FCFS|SCAN|FIFO'],['Turnaround time equals','completion time minus arrival time','burst minus waiting|arrival plus response|quantum plus burst']],Synchronization:[['A race condition depends on','Execution timing','Disk size|File name|Page color'],['A mutex provides','Mutual exclusion','Paging|Disk mirroring|Authentication'],['A binary semaphore is conceptually','0 or 1','A file path|A cylinder|A PID only'],['The critical-section requirement that prevents simultaneous entry is','Mutual exclusion','Progress|Bounded waiting|Preemption'],['The producer-consumer problem commonly uses','Semaphores and a bounded buffer','Only page tables|Disk scheduling|File allocation']],Deadlocks:[['A Coffman deadlock condition is','Circular wait','Unlimited resources|Forced preemption|No sharing'],["Banker's algorithm supports",'Deadlock avoidance','File allocation|Disk formatting|Authentication'],['A safe state means','a safe completion sequence exists','no process is running|all resources are free|deadlock already exists'],['Deadlock prevention works by','breaking at least one necessary condition','increasing page size|using FCFS only|disabling interrupts forever'],['A resource-allocation graph cycle guarantees deadlock when','each resource type has one instance','resources have many instances|preemption is enabled|processes never wait']],Memory:[['A page fault means the page is','Not in physical memory','In the TLB|Already executing|In a register'],['The TLB caches','Address translations','Whole processes|Disk jobs|User accounts'],['LRU removes the page','Unused for the longest time','Loaded first|Largest number|Used most recently'],['Thrashing means excessive','Paging','Compilation|Authentication|Printing'],['Internal fragmentation is unused space','inside an allocated block','between free holes only|in the TLB|on a disk track']],Storage:[['SSTF chooses the request','Closest to the head','Oldest only|Largest only|Randomly'],['SCAN is also called','Elevator scheduling','Banker scheduling|Clock replacement|Buddy allocation'],['FCFS disk scheduling serves requests in','arrival order','track order|shortest seek only|reverse order'],['C-SCAN services requests while moving','in one direction with a return jump','randomly|only inward|between two fixed tracks'],['Seek time is the time to','move the disk head to a track','rotate a sector under the head|transfer bytes|update an inode']],['File Systems']:[['An inode stores','Metadata and block pointers','Only file name|CPU registers|Semaphores'],['Journaling improves','Crash recovery','CPU speed|Quantum size|TLB capacity'],['A directory maps','file names to file information','virtual pages to frames|processes to CPUs|tracks to sectors'],['Contiguous file allocation provides','fast sequential and direct access','no external fragmentation|automatic journaling|unlimited growth'],['A hard link refers to','the same inode as another directory entry','a pathname stored as text|a mounted disk only|a process descriptor']],Protection:[['Least privilege means','Only needed permissions','All admin rights|No permissions|Permanent kernel mode'],['A system call lets a program','Request a kernel service','Bypass protection|Run every privileged instruction|Disable all interrupts'],['User mode restricts','privileged instructions','all arithmetic|file names|virtual addresses'],['An access-control list is associated with','an object','a CPU burst|a page fault|a time quantum'],['Authentication establishes','identity','permission only|CPU ownership|page replacement']]};
let bank=[];Object.entries(topics).forEach(([topic,items])=>items.forEach((x,i)=>{for(let v=0;v<3;v++){let o=[x[1],...x[2].split('|')];o.sort(()=>Math.random()-.5);bank.push({id:'OSQ'+(bank.length+1),topic,difficulty:['easy','medium','scenario'][v],q:v===0?x[0]+':':v===1?'Choose the correct answer: '+x[0].toLowerCase()+':':'In an applied OS scenario, '+x[0].toLowerCase()+':',o,a:o.indexOf(x[1]),e:'Correct answer: '+x[1]+'.'})}}));
const app=document.getElementById('app'),who=document.getElementById('who');let state=load('os_studio',{profile:{},practice:{},history:[]}),run=null,tick=null;function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}function save(){localStorage.setItem('os_studio',JSON.stringify(state));who.textContent=state.profile.name||'Guest'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pages={Dashboard:home,Practice:study,Challenge:challenge,Examination:examSetup,Mastery:mastery,Simulators:simulators,Reports:results,'Profile & backup':profilePage};nav.innerHTML=Object.keys(pages).map((x,i)=>`<button class="nav ${i?'':'active'}" data-page="${x}">${x}</button>`).join('');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page,b));function go(n,b){clearInterval(tick);document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');pages[n]();scrollTo(0,0)}
function home(){app.innerHTML=`<section class="card"><span class="tag">Student edition • ${bank.length}-question bank</span><h2>Welcome, ${esc(state.profile.name||'student')}</h2><p>Every Studio button now contains a complete activity.</p><div class="grid"><div class="metric"><strong>${Object.keys(state.practice).length}</strong><br>answers practiced</div><div class="metric"><strong>${state.history.length}</strong><br>assessments</div><div class="metric"><strong>${bank.length}</strong><br>questions</div><div class="metric"><strong>6</strong><br>simulators</div></div></section>`}
function study(){let ts=Object.keys(topics);app.innerHTML=`<section class="card"><h2>Practice</h2><select id="topic">${ts.map(t=>`<option>${t}</option>`).join('')}</select><label>Questions<select id="pcount"><option>10</option><option>20</option><option>30</option></select></label><button class="btn primary" onclick="drawPractice()">Start practice</button><div id="practiceArea"></div></section>`}function drawPractice(){let qs=shuffle(bank.filter(q=>q.topic===topic.value)).slice(0,+pcount.value);practiceArea.innerHTML=qs.map((q,i)=>`<div class="question"><div class="tiny">${q.topic} • ${q.difficulty} • ${q.id}</div><b>${i+1}. ${q.q}</b>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="${q.id}" value="${j}"> ${o}</label>`).join('')}<button class="btn secondary" onclick="answer('${q.id}')">Check</button><div id="f${q.id}"></div></div>`).join('')}function answer(id){let q=bank.find(x=>x.id===id),v=document.querySelector(`input[name="${id}"]:checked`);if(!v)return document.getElementById('f'+id).innerHTML='<span class="bad">Select an answer.</span>';let ok=+v.value===q.a;state.practice[id]=ok;save();document.getElementById('f'+id).innerHTML=`<span class="${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}.</span> ${q.e}`}
function challenge(){start('Challenge',shuffle(bank.filter(q=>q.difficulty==='scenario')).slice(0,10),600,true,60)}function examSetup(){app.innerHTML=`<section class="card"><h2>Timed Examination</h2><div class="grid"><label>Questions<select id="cnt"><option>20</option><option>40</option><option>60</option><option>80</option></select></label><label>Minutes<select id="mins"><option>20</option><option selected>40</option><option>60</option><option>80</option><option>120</option></select></label><label>Pass mark<input id="pass" type="number" value="60"></label></div><button class="btn primary" onclick="start('Examination',shuffle(bank).slice(0,+cnt.value),+mins.value*60,false,+pass.value)">Start examination</button></section>`}
function start(title,items,seconds,feedback,pass){run={title,items,seconds,feedback,pass,answers:{},flags:{},idx:0,start:Date.now(),done:false};render();tick=setInterval(()=>{run.seconds--;let t=document.getElementById('timer');if(t)t.textContent=fmt(run.seconds);if(run.seconds<=0)submit(true)},1000)}function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function render(){let q=run.items[run.idx],s=run.answers[run.idx];app.innerHTML=`<section class="card"><div class="row" style="justify-content:space-between"><span class="tag">${run.title}</span><span class="timer" id="timer">${fmt(run.seconds)}</span></div><div class="navigator">${run.items.map((_,i)=>`<button class="${i===run.idx?'cur ':''}${run.answers[i]!==undefined?'ans ':''}${run.flags[i]?'flag':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class="progress"><div style="width:${Object.keys(run.answers).length/run.items.length*100}%"></div></div><div class="question"><div class="tiny">${q.topic} • ${q.difficulty}</div><h2>${run.idx+1}. ${q.q}</h2>${q.o.map((o,j)=>`<label class="option"><input type="radio" name="r" ${s===j?'checked':''} onchange="runAnswer(${j})"> ${o}</label>`).join('')}${run.feedback&&s!==undefined?`<p>${s===q.a?'<span class="good">Correct. </span>':'<span class="bad">Incorrect. </span>'}${q.e}</p>`:''}</div><div class="row"><button class="btn secondary" onclick="jump(${Math.max(0,run.idx-1)})">Previous</button><button class="btn secondary" onclick="flag()">Flag</button><button class="btn primary" onclick="jump(${Math.min(run.items.length-1,run.idx+1)})">Next</button><button class="btn secondary" onclick="submit()">Submit</button></div></section>`}function jump(i){run.idx=i;render()}function flag(){run.flags[run.idx]=!run.flags[run.idx];render()}function runAnswer(j){run.answers[run.idx]=j;render()}function submit(auto=false){if(!run||run.done)return;run.done=true;clearInterval(tick);let score=run.items.filter((q,i)=>run.answers[i]===q.a).length,pct=Math.round(score/run.items.length*100),r={date:new Date().toISOString(),title:run.title,score,total:run.items.length,pct,pass:run.pass,time:Math.round((Date.now()-run.start)/1000)};state.history.unshift(r);save();report(r,auto)}
function mastery(){let ts=Object.keys(topics);app.innerHTML=`<section class="card"><h2>Mastery</h2><table><tr><th>Topic</th><th>Attempted</th><th>Accuracy</th></tr>${ts.map(t=>{let qs=bank.filter(q=>q.topic===t&&q.id in state.practice),c=qs.filter(q=>state.practice[q.id]).length;return`<tr><td>${t}</td><td>${qs.length}</td><td>${qs.length?Math.round(c/qs.length*100):0}%</td></tr>`}).join('')}</table></section>`}
function simulators(){app.innerHTML=`<section class="card"><h2>OS Simulators</h2><div class="grid"><div class="sim"><h3>CPU FCFS</h3><input id="bursts" value="5,3,8,6"><button class="btn primary" onclick="cpu()">Run</button><div id="cpuOut"></div></div><div class="sim"><h3>Round Robin</h3><input id="rrb" value="5,3,8"><input id="rrq" value="2"><button class="btn primary" onclick="rr()">Run</button><div id="rrOut"></div></div><div class="sim"><h3>FIFO Paging</h3><input id="refs" value="7,0,1,2,0,3,0,4"><input id="frames" value="3"><button class="btn primary" onclick="paging(false)">Run</button><div id="pageOut"></div></div><div class="sim"><h3>LRU Paging</h3><input id="lrefs" value="7,0,1,2,0,3,0,4"><input id="lframes" value="3"><button class="btn primary" onclick="paging(true)">Run</button><div id="lruOut"></div></div><div class="sim"><h3>Banker's Safety</h3><button class="btn primary" onclick="bankerOut.innerHTML='<p class=good>Safe sequence: P1 → P3 → P4 → P0 → P2</p>'">Analyze example</button><div id="bankerOut"></div></div><div class="sim"><h3>Disk FCFS</h3><input id="diskQueue" value="98,183,37,122,14,124,65,67"><input id="diskHead" value="53"><button class="btn primary" onclick="disk()">Run</button><div id="diskOutput"></div></div></div></section>`}function nums(s){return s.split(',').map(Number).filter(Number.isFinite)}function cpu(){let b=nums(bursts.value),t=0,w=0;cpuOut.innerHTML=b.map((x,i)=>{w+=t;let st=t;t+=x;return`P${i+1}: ${st}-${t}<br>`}).join('')+`Average waiting: ${(w/b.length).toFixed(2)}`}function rr(){let b=nums(rrb.value),rem=[...b],q=+rrq.value,t=0,log=[];while(rem.some(x=>x>0)){rem.forEach((x,i)=>{if(x>0){let z=Math.min(q,x);log.push(`P${i+1}: ${t}-${t+z}`);t+=z;rem[i]-=z}})}rrOut.innerHTML=log.join('<br>')}function paging(lru){let r=nums((lru?lrefs:refs).value),n=+(lru?lframes:frames).value,f=[],next=0,last={},fault=0;r.forEach((x,i)=>{if(!f.includes(x)){fault++;if(f.length<n)f.push(x);else{let v=lru?f.reduce((a,b)=>(last[a]??-1)<(last[b]??-1)?a:b):f[next];f[f.indexOf(v)]=x;if(!lru)next=(next+1)%n}}last[x]=i});document.getElementById(lru?'lruOut':'pageOut').innerHTML=`Faults: <b>${fault}</b>; final frames: [${f}]`}function disk(){let queue=nums(diskQueue.value),head=+diskHead.value,m=0,path=[head];queue.forEach(x=>{m+=Math.abs(x-head);head=x;path.push(x)});diskOutput.innerHTML=`Path: ${path.join(' → ')}<br>Total movement: <b>${m}</b>`}
function report(r,auto=false){app.innerHTML=`<section class="card"><h2>${r.title} report</h2><div class="big">${r.score}/${r.total} (${r.pct}%)</div><p class="${r.pct>=r.pass?'good':'bad'}">${r.pct>=r.pass?'Passed':'Not passed'}${auto?' • Time expired':''} • ${fmt(r.time)}</p><button class="btn primary no-print" onclick="print()">Print / Save PDF</button></section>`}function results(){app.innerHTML=`<section class="card"><h2>Reports</h2>${state.history.length?state.history.map((r,i)=>`<div class="question">${new Date(r.date).toLocaleString()} • ${r.title} • ${r.pct}% <button class="btn secondary" onclick="report(state.history[${i}])">View</button></div>`).join(''):'<p>No reports yet.</p>'}</section>`}function profilePage(){app.innerHTML=`<section class="card"><h2>Profile & backup</h2><input id="pn" placeholder="Name" value="${esc(state.profile.name)}"><input id="pid" placeholder="Student ID" value="${esc(state.profile.id)}"><button class="btn primary" onclick="state.profile={name:pn.value,id:pid.value};save();home()">Save</button><button class="btn secondary" onclick="backup()">Export backup</button></section>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='os_progress.json';a.click()}function accessibility(){app.innerHTML=`<section class="card"><h2>Accessibility</h2><button class="btn secondary" onclick="document.body.classList.toggle('light')">Light / dark</button> <button class="btn secondary" onclick="document.body.classList.toggle('high')">High contrast</button> <button class="btn secondary" onclick="document.documentElement.style.setProperty('--fs','18px')">Larger text</button></section>`}save();home();
</script></body></html>
