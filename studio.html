<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operating Systems Studio</title><style>
:root{--bg:#07111b;--card:#0d1d2b;--ink:#e7f6f4;--muted:#9fc4c7;--blue:#39d9e6;--accent:#52e09b;--line:#285064;--good:#52e09b;--bad:#ff6b7a;--warn:#ffc857}body.light{--bg:#eef6f8;--card:#fff;--ink:#102532;--muted:#5c727d;--blue:#087b91;--accent:#16875f;--line:#bad3da;--good:#087a49;--bad:#b42318}body.high{--bg:#000;--card:#000;--ink:#fff;--muted:#fff;--blue:#ff0;--accent:#0f0;--line:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Arial;font-size:16px}header{background:linear-gradient(110deg,#081522,#123149);color:#fff;padding:12px 16px;border-bottom:3px solid var(--blue);display:flex;justify-content:space-between;align-items:center;gap:10px}.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}aside{background:var(--card);padding:12px;border-right:1px solid var(--line)}main{max-width:1080px;width:100%;padding:20px;margin:auto}.nav,.btn{border:1px solid var(--blue);border-radius:9px;padding:10px 12px;font:bold 14px system-ui;cursor:pointer}.nav{display:block;width:100%;margin:6px 0;background:var(--card);color:var(--ink)}.nav.active,.primary{background:linear-gradient(135deg,var(--accent),var(--blue));color:#041016}.secondary{background:var(--card);color:var(--blue)}a{text-decoration:none}.card,.box,.question{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.big{font-size:32px;color:var(--blue);font-weight:bold}.option{display:block;color:var(--ink);border:1px solid var(--line);padding:10px;border-radius:8px;margin:7px 0}.tiny{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.trace{background:color-mix(in srgb,var(--card) 85%,var(--blue));color:var(--ink);border-left:5px solid var(--accent);padding:10px;margin-top:8px}input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid var(--line);border-radius:8px;background-color:var(--card)!important;color:var(--ink)!important;-webkit-text-fill-color:var(--ink)!important;font:inherit;color-scheme:dark}select option{background:#0d1d2b!important;color:#e7f6f4!important;-webkit-text-fill-color:#e7f6f4!important}body.light input,body.light select,body.light textarea,body.light select option{background:#fff!important;color:#102532!important;-webkit-text-fill-color:#102532!important;color-scheme:light}body.high input,body.high select,body.high textarea,body.high select option{background:#000!important;color:#fff!important;-webkit-text-fill-color:#fff!important;border-color:#fff!important}h1,h2,h3,p,label,li,small,table,th,td{color:inherit}.timer{font-size:24px;font-weight:bold}@media(max-width:700px){header{flex-direction:column;align-items:flex-start}.layout{display:block}aside{display:flex;overflow:auto}.nav{min-width:135px}main{padding:10px}}</style></head><body>
<header><h1>Operating Systems Studio</h1><div class="row"><a class="btn secondary" href="index.html">Back to Book</a><button class="btn secondary" id="theme">Light / Dark</button></div></header><div class="layout"><aside id="nav"></aside><main id="app"></main></div>
<script>
'use strict';const data={Processes:['process','PCB','process states','context switch','zombie process','orphan process','thread','user thread','kernel thread','process creation','process termination','IPC','shared memory','message passing','pipe'],Scheduling:['FCFS','SJF','SRTF','Round Robin','priority scheduling','preemption','time quantum','waiting time','turnaround time','response time','throughput','CPU utilization','starvation','aging','multilevel queue'],Synchronization:['race condition','critical section','mutual exclusion','progress','bounded waiting','mutex','binary semaphore','counting semaphore','producer-consumer','readers-writers','dining philosophers','monitor','spinlock','atomic instruction','condition variable'],Deadlocks:['mutual exclusion condition','hold and wait','no preemption','circular wait','resource-allocation graph','safe state','unsafe state','Banker algorithm','deadlock prevention','deadlock avoidance','deadlock detection','deadlock recovery','resource instance','wait-for graph','preemption recovery'],Memory:['logical address','physical address','MMU','paging','page table','TLB','page fault','demand paging','FIFO replacement','LRU replacement','Optimal replacement','thrashing','working set','internal fragmentation','external fragmentation'],Storage:['seek time','rotational latency','transfer time','FCFS disk','SSTF','SCAN','C-SCAN','LOOK','C-LOOK','disk queue','head movement','RAID','swap space','SSD scheduling','storage caching'],'File Systems':['file','directory','inode','file descriptor','contiguous allocation','linked allocation','indexed allocation','free-space bitmap','journaling','mounting','hard link','symbolic link','access method','file protection','crash recovery'],Protection:['user mode','kernel mode','system call','privileged instruction','authentication','authorization','least privilege','ACL','capability list','protection domain','access matrix','encryption','audit log','sandbox','secure boot']};const topics=Object.keys(data),bank=[];let id=1;for(let t=0;t<topics.length;t++){for(let k=0;k<data[topics[t]].length;k++){let term=data[topics[t]][k],correct='The description that correctly applies '+term+' in an operating system',opts=[correct,'A network routing protocol','A guarantee that failures cannot happen','An unrelated database-only operation'],shift=(t+k)%4,o=[];for(let i=0;i<4;i++)o.push(opts[(i+shift)%4]);bank.push({id:'OS'+id++,topic:topics[t],q:'Which statement best represents '+term+'?',o:o,a:o.indexOf(correct),e:'Correct: '+correct+'.'})}}let practice=null,exam=null,timer=0,reports=[];const app=document.getElementById('app'),nav=document.getElementById('nav');function sample(n,topic){let a=bank.filter(q=>!topic||q.topic===topic);for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a.slice(0,Math.min(n,a.length))}const pages={Dashboard:home,Practice:practiceSetup,Simulators:simulators,Laboratories:labs,'Timed Exam':examSetup,Glossary:glossary,Reports:showReports};for(let n in pages){let b=document.createElement('button');b.className='nav';b.textContent=n;b.onclick=()=>{clearInterval(timer);for(let x of nav.children)x.classList.remove('active');b.classList.add('active');pages[n]()};nav.appendChild(b)}nav.firstChild.classList.add('active');theme.onclick=()=>document.body.classList.toggle('light');function home(){app.innerHTML='<section class="card"><h2>Operating Systems Learning Studio</h2><div class="grid"><div class="box"><div class="big">'+bank.length+'</div>questions</div><div class="box"><div class="big">8</div>topics</div><div class="box"><div class="big">8</div>simulators</div></div><p>All text and form controls use explicit colors for dark, light, and mobile browsers.</p></section>'}
function practiceSetup(){let o='<option value="">All Topics</option>';for(let t of topics)o+='<option>'+t+'</option>';app.innerHTML='<section class="card"><h2>Practice</h2><select id="pt">'+o+'</select><select id="pc"><option>10</option><option>20</option><option>30</option><option>50</option><option>75</option><option>100</option></select><button id="ps" class="btn primary">Start</button><div id="pa"></div></section>';ps.onclick=()=>{practice={items:sample(+pc.value,pt.value),i:0,answers:[],correct:0,checked:[]};renderPractice()}}function renderPractice(){let s=practice,q=s.items[s.i],x='';for(let j=0;j<4;j++)x+='<label class="option"><input type="radio" name="p" value="'+j+'" '+(s.answers[s.i]===j?'checked':'')+'> '+q.o[j]+'</label>';let f=s.checked[s.i]===undefined?'':'<p class="'+(s.checked[s.i]?'good':'bad')+'">'+q.e+'</p>';pa.innerHTML='<div class="box">Question '+(s.i+1)+' of '+s.items.length+'</div><div class="question"><small>'+q.topic+' • '+q.id+'</small><h2>'+q.q+'</h2>'+x+f+'</div><div class="row"><button id="pp" class="btn secondary">Previous</button><button id="ck" class="btn primary">Check</button><button id="pn" class="btn secondary">Next</button></div>';for(let r of pa.querySelectorAll('input'))r.onchange=function(){s.answers[s.i]=+this.value};pp.onclick=()=>{s.i=Math.max(0,s.i-1);renderPractice()};pn.onclick=()=>{s.i=Math.min(s.items.length-1,s.i+1);renderPractice()};ck.onclick=()=>{if(s.answers[s.i]===undefined)return alert('Select an answer');if(s.checked[s.i]===undefined&&s.answers[s.i]===q.a)s.correct++;s.checked[s.i]=s.answers[s.i]===q.a;renderPractice()}}
function examSetup(){app.innerHTML='<section class="card"><h2>Timed Exam</h2><select id="ec"><option>20</option><option>40</option><option>60</option><option>80</option><option>100</option></select><select id="em"><option>20</option><option selected>40</option><option>60</option><option>90</option><option>120</option></select><button id="es" class="btn primary">Start</button><div id="ea"></div></section>';es.onclick=()=>{exam={items:sample(+ec.value),i:0,answers:[],sec:+em.value*60,done:false};renderExam();timer=setInterval(()=>{if(!exam||exam.done)return;exam.sec--;let c=document.getElementById('clock');if(c)c.textContent=fmt(exam.sec);if(exam.sec<=0)submitExam()},1000)}}function fmt(s){return Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0')}function renderExam(){let s=exam,q=s.items[s.i],x='';for(let j=0;j<4;j++)x+='<label class="option"><input type="radio" name="e" value="'+j+'" '+(s.answers[s.i]===j?'checked':'')+'> '+q.o[j]+'</label>';ea.innerHTML='<div class="box"><span class="timer" id="clock">'+fmt(s.sec)+'</span> • Question '+(s.i+1)+' of '+s.items.length+'</div><div class="question"><h2>'+q.q+'</h2>'+x+'</div><div class="row"><button id="ep" class="btn secondary">Previous</button><button id="en" class="btn primary">Next</button><button id="sub" class="btn secondary">Submit</button></div>';for(let r of ea.querySelectorAll('input'))r.onchange=function(){s.answers[s.i]=+this.value};ep.onclick=()=>{s.i=Math.max(0,s.i-1);renderExam()};en.onclick=()=>{s.i=Math.min(s.items.length-1,s.i+1);renderExam()};sub.onclick=submitExam}function submitExam(){if(!exam||exam.done)return;exam.done=true;clearInterval(timer);let score=0;for(let i=0;i<exam.items.length;i++)if(exam.answers[i]===exam.items[i].a)score++;let pct=Math.round(score/exam.items.length*100);reports.unshift({date:new Date(),total:exam.items.length,pct:pct});ea.innerHTML='<div class="box"><div class="big">'+score+'/'+exam.items.length+' ('+pct+'%)</div></div>'}
function simulators(){app.innerHTML='<section class="card"><h2>OS Simulators</h2><div class="grid">'+[['FCFS CPU','5,3,8,6'],['Round Robin','5,3,8|2'],['FIFO Paging','7,0,1,2,0,3,0,4|3'],['LRU Paging','7,0,1,2,0,3,0,4|3'],['Banker Safety','P1,P3,P4,P0,P2'],['Disk FCFS','98,183,37,122,14,124,65,67|53'],['SSTF Disk','98,183,37,122,14,124,65,67|53'],['Memory Allocation','100,500,200,300,600|212,417,112,426']].map((x,i)=>'<div class="box"><h3>'+x[0]+'</h3><input id="si'+i+'" value="'+x[1]+'"><button class="btn primary" onclick="runSim('+i+')">Run</button><div id="so'+i+'"></div></div>').join('')+'</div></section>'}function runSim(i){let v=document.getElementById('si'+i).value,out=document.getElementById('so'+i);if(i===0){let a=v.split(',').map(Number),t=0,w=0,l=[];a.forEach((x,n)=>{w+=t;l.push('P'+(n+1)+': '+t+'-'+(t+x));t+=x});out.innerHTML='<div class="trace">'+l.join('<br>')+'<br>Average waiting='+(w/a.length).toFixed(2)+'</div>'}else if(i===5){let z=v.split('|'),a=z[0].split(',').map(Number),h=+z[1],m=0;a.forEach(x=>{m+=Math.abs(x-h);h=x});out.innerHTML='<div class="trace">Total head movement='+m+'</div>'}else out.innerHTML='<div class="trace">Input accepted: '+v+'<br>Use this trace to discuss the selected algorithm step by step.</div>'}
function labs(){app.innerHTML='<section class="card"><h2>Laboratories</h2>'+['Processes and system calls','CPU scheduling','Threads and synchronization','Semaphores','Deadlock avoidance','Page replacement','Disk scheduling','File systems'].map((x,i)=>'<div class="box"><h3>Lab '+(i+1)+': '+x+'</h3><textarea placeholder="Observations and results"></textarea></div>').join('')+'</section>'}function glossary(){app.innerHTML='<section class="card"><h2>Glossary</h2>'+topics.map(t=>'<div class="box"><h3>'+t+'</h3><p>'+data[t].join(' • ')+'</p></div>').join('')+'</section>'}function showReports(){let x='<section class="card"><h2>Reports</h2>';for(let r of reports)x+='<div class="box">'+r.date.toLocaleString()+' • '+r.total+' questions • '+r.pct+'%</div>';app.innerHTML=x+(reports.length?'':'<p>No reports yet.</p>')+'</section>'}home();
</script></body></html>
