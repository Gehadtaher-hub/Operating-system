<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1622">
  <title>Operating Systems Ebook</title>
  <style>
    :root{
      --bg:#07111b;--panel:#0d1d2b;--panel2:#12283a;--ink:#e7f6f4;
      --muted:#9fc4c7;--cyan:#39d9e6;--green:#52e09b;--amber:#ffc857;
      --line:#285064;--danger:#ff6b7a;--paper:#f7fbfc
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 15% 0,#14334a 0,#091722 38%,#050c13 100%);color:var(--ink)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:linear-gradient(#39d9e61a 1px,transparent 1px),linear-gradient(90deg,#39d9e61a 1px,transparent 1px);background-size:32px 32px}
    header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 20px;background:linear-gradient(110deg,#081522f5,#123149f5);border-bottom:3px solid var(--cyan);box-shadow:0 5px 20px #0009}
    .brand{min-width:220px}
    h1{margin:0;font-size:clamp(20px,3vw,31px);letter-spacing:.2px}
    .subtitle{margin-top:4px;color:var(--muted);font-size:13px}
    .prompt{color:var(--green);font-family:Consolas,"Courier New",monospace}
    .header-actions{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px}
    .btn,.toolbar button,.toolbar input{border:1px solid var(--line);border-radius:9px;padding:10px 14px;font-weight:750}
    .btn{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:#102535;color:var(--ink);transition:transform .2s,border-color .2s,box-shadow .2s}
    .btn:hover,.btn:focus-visible{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 0 0 2px #39d9e622,0 7px 18px #0006}
    .btn.active{color:#041016;background:linear-gradient(135deg,var(--green),var(--cyan));border-color:#a8fbff;box-shadow:0 0 18px #39d9e644}
    .wrap{position:relative;padding:14px 16px 24px;display:flex;flex-direction:column;align-items:center}
    .toolbar{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:12px;padding:9px 13px;background:#0d1d2bea;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0005}
    .toolbar button,.toolbar input{background:#12283a;color:var(--ink)}
    .toolbar button{cursor:pointer}
    .toolbar button:hover{border-color:var(--green)}
    .toolbar input{width:72px}
    .status{font-family:Consolas,"Courier New",monospace;color:var(--green)}
    .hint{color:var(--muted);font-size:13px}
    .book-shell{width:min(1250px,98vw);height:calc(100vh - 175px);min-height:310px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:8px}
    .flip-book{display:none;filter:drop-shadow(0 20px 25px #000b)}
    .page{position:relative;overflow:hidden;background:var(--paper);box-shadow:inset 0 0 0 1px #7fa6b8}
    .page canvas{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
    .link-layer{position:absolute;inset:0;pointer-events:none}
    .pdf-link{position:absolute;pointer-events:auto;cursor:pointer;background:transparent;border:0;padding:0}
    .pdf-link:hover{background:#39d9e633;outline:2px solid var(--cyan)}
    .loading{max-width:540px;margin-top:35px;padding:32px;background:linear-gradient(145deg,#102535,#0a1824);border:1px solid var(--line);border-radius:15px;text-align:center;box-shadow:0 14px 35px #0007}
    .loader{width:44px;height:44px;margin:0 auto 15px;border:4px solid #244b5c;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error{color:var(--danger)}
    .watermark{position:absolute;left:0;right:0;bottom:9px;text-align:center;color:#08707f2b;font:800 12px Consolas,"Courier New",monospace;pointer-events:none}
    @media(max-width:760px){header{position:relative;flex-direction:column;align-items:flex-start;padding:11px}.header-actions{width:100%;justify-content:flex-start}.btn{padding:9px 11px;font-size:12px}.wrap{padding:8px}.book-shell{height:calc(100vh - 300px)}.toolbar{font-size:12px}.hint{display:none}}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <h1 id="pageTitle">Operating Systems Ebook</h1>
      <div id="subtitle" class="subtitle"><span class="prompt">$</span> concepts, architecture, processes, memory, and scheduling</div>
    </div>
    <nav class="header-actions" aria-label="Book selection">
      <a id="ebookBtn" class="btn" href="./index.html">💻 Main Ebook</a>
      <a id="practicalBtn" class="btn" href="./index.html?book=practical">🧪 Practical Book</a>
          <a class="btn" href="studio.html">⚙️ Interactive Activities</a>
    </nav>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <button id="prev" type="button">◀ Previous</button>
      <span id="status" class="status" aria-live="polite">Booting viewer...</span>
      <span class="hint">Contents and embedded PDF links are clickable</span>
      <button id="next" type="button">Next ▶</button>
      <label>Page <input id="pageNo" type="number" min="1" value="1"></label>
    </div>

    <div class="book-shell">
      <div id="loading" class="loading">
        <div class="loader" aria-hidden="true"></div>
        <h2 id="loadingTitle">Loading Operating Systems Ebook</h2>
        <p>Rendering pages and preparing clickable links...</p>
      </div>
      <div id="book" class="flip-book"></div>
    </div>
  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const params=new URLSearchParams(window.location.search);
    const isPractical=params.get('book')==='practical';
    const pdfFile=isPractical?'OS_Practical_Book.pdf':'operatingsystem_2025 (2).pdf';
    const currentTitle=isPractical?'Operating Systems Practical Book':'Operating Systems Ebook';
    const currentSubtitle=isPractical?'hands-on labs, commands, exercises, and experiments':'concepts, architecture, processes, memory, and scheduling';
    const watermarkText=isPractical?'OPERATING SYSTEMS PRACTICAL BOOK':'OPERATING SYSTEMS EBOOK';

    const pageTitle=document.getElementById('pageTitle');
    const subtitle=document.getElementById('subtitle');
    const ebookBtn=document.getElementById('ebookBtn');
    const practicalBtn=document.getElementById('practicalBtn');
    const root=document.getElementById('book');
    const loading=document.getElementById('loading');
    const loadingTitle=document.getElementById('loadingTitle');
    const status=document.getElementById('status');
    const pageNo=document.getElementById('pageNo');
    const prev=document.getElementById('prev');
    const next=document.getElementById('next');

    document.title=currentTitle;
    pageTitle.textContent=currentTitle;
    subtitle.innerHTML='<span class="prompt">$</span> '+currentSubtitle;
    loadingTitle.textContent='Loading '+currentTitle;
    (isPractical?practicalBtn:ebookBtn).classList.add('active');

    let book,total=0,pdfDoc=null;

    async function targetPage(dest){
      try{
        const destination=typeof dest==='string'?await pdfDoc.getDestination(dest):dest;
        if(!destination)return null;
        const ref=destination[0];
        if(typeof ref==='object')return (await pdfDoc.getPageIndex(ref))+1;
        if(Number.isInteger(ref))return ref+1;
      }catch(error){}
      return null;
    }

    async function addLinks(pdfPage,pageDiv,viewport){
      const annotations=await pdfPage.getAnnotations({intent:'display'});
      const layer=document.createElement('div');
      layer.className='link-layer';

      for(const annotation of annotations){
        if(annotation.subtype!=='Link'||!annotation.rect)continue;
        const rect=viewport.convertToViewportRectangle(annotation.rect);
        const x=Math.min(rect[0],rect[2]);
        const y=Math.min(rect[1],rect[3]);
        const width=Math.abs(rect[2]-rect[0]);
        const height=Math.abs(rect[3]-rect[1]);
        const element=document.createElement('button');
        element.className='pdf-link';
        element.type='button';
        element.style.left=(x/viewport.width*100)+'%';
        element.style.top=(y/viewport.height*100)+'%';
        element.style.width=(width/viewport.width*100)+'%';
        element.style.height=(height/viewport.height*100)+'%';
        element.title=annotation.url?'Open external link':'Go to section';
        element.setAttribute('aria-label',element.title);
        element.addEventListener('pointerdown',event=>event.stopPropagation());
        element.addEventListener('click',async event=>{
          event.preventDefault();
          event.stopPropagation();
          if(annotation.url){
            window.open(annotation.url,'_blank','noopener');
          }else{
            const page=await targetPage(annotation.dest);
            if(page&&book)book.flip(page-1);
          }
        });
        layer.appendChild(element);
      }
      pageDiv.appendChild(layer);
    }

    async function init(){
      try{
        pdfDoc=await pdfjsLib.getDocument(pdfFile).promise;
        total=pdfDoc.numPages;
        pageNo.max=total;

        for(let number=1;number<=total;number++){
          status.textContent='Loading '+number+'/'+total;
          const pdfPage=await pdfDoc.getPage(number);
          const viewport=pdfPage.getViewport({scale:1.25});
          const canvas=document.createElement('canvas');
          canvas.width=viewport.width;
          canvas.height=viewport.height;
          await pdfPage.render({canvasContext:canvas.getContext('2d'),viewport}).promise;

          const pageDiv=document.createElement('div');
          pageDiv.className='page';
          if(number===1)pageDiv.dataset.density='hard';
          pageDiv.appendChild(canvas);
          await addLinks(pdfPage,pageDiv,viewport);

          const watermark=document.createElement('div');
          watermark.className='watermark';
          watermark.textContent=watermarkText;
          pageDiv.appendChild(watermark);
          root.appendChild(pageDiv);
        }

        loading.style.display='none';
        root.style.display='block';
        book=new St.PageFlip(root,{width:550,height:730,size:'stretch',minWidth:220,maxWidth:650,minHeight:280,maxHeight:760,showCover:true,mobileScrollSupport:false,usePortrait:true,drawShadow:true,flippingTime:700});
        book.loadFromHTML(document.querySelectorAll('.page'));
        book.on('flip',event=>{
          status.textContent='Page '+(event.data+1)+' of '+total;
          pageNo.value=event.data+1;
        });
        status.textContent='Page 1 of '+total;
      }catch(error){
        loading.innerHTML='<h2 class="error">Unable to load '+(isPractical?'the practical book':'the main ebook')+'</h2><p>Confirm that <strong>'+pdfFile+'</strong> is in the same folder as <strong>index.html</strong>.</p><small>'+error.message+'</small>';
        status.textContent='File not found';
      }
    }

    function goPage(){
      if(!book)return;
      const requested=Math.max(1,Math.min(total,Number(pageNo.value)||1));
      book.flip(requested-1);
    }

    prev.onclick=()=>book&&book.flipPrev();
    next.onclick=()=>book&&book.flipNext();
    pageNo.onchange=goPage;
    init();
  </script>
</body>
</html>
